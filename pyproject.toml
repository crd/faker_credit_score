[project]
name = "faker-credit-score"
dynamic = ["version"]
description = "Generate realistic fake credit scores (FICO 8, VantageScore, etc.) for testing fintech, lending, and insurance applications. A Faker provider with tier-based generation and 10 scoring models."
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
authors = [{ name = "Cory Donnelly" }]
keywords = ["faker", "credit-score", "fico", "vantagescore", "test-data", "fintech", "lending", "mock-data"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: BSD License",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Software Development :: Testing",
  "Topic :: Office/Business :: Financial",
  "Framework :: Faker",
]
dependencies = [
    "faker>=37.8.0",
]

[project.urls]
Homepage = "https://github.com/crd/faker-credit-score"
Repository = "https://github.com/crd/faker-credit-score"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "python-coveralls>=2.9.3",
]

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "faker_credit_score/_version.py"  # optional file you can import if desired

# (Nice-to-have) name an index for TestPyPI so `uv publish --index testpypi` works
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true